<div class="stage" (click)="poke()">
  <div class="ground-shadow"></div>

  <div class="bob">
    <div class="lean">
      <div class="body">
        <div class="swirl"></div>
        <div class="sheen"></div>
      </div>

      <svg class="face" viewBox="0 0 100 100">
        <!-- brows: only visible when confused / sad -->
        <path class="brow left"  d="M31 35 Q37 32 43 35" />
        <path class="brow right" d="M57 35 Q63 32 69 35" />

        <g class="eyes">
          <g class="eye left">
            <ellipse class="pupil" cx="38" cy="47" rx="4.6" ry="6" />
            <circle class="glint" cx="39.6" cy="44.6" r="1.6" />
          </g>
          <g class="eye right">
            <ellipse class="pupil" cx="62" cy="47" rx="4.6" ry="6" />
            <circle class="glint" cx="63.6" cy="44.6" r="1.6" />
          </g>
        </g>

        <!-- ^ ^ eyes for happy -->
        <g class="eyes-happy">
          <path d="M33 48 Q38 41 43 48" />
          <path d="M57 48 Q62 41 67 48" />
        </g>

        <ellipse class="cheek left"  cx="27" cy="58" rx="6" ry="3.6" />
        <ellipse class="cheek right" cx="73" cy="58" rx="6" ry="3.6" />

        <path class="mouth" d="M40 61 Q45 66 50 66 Q55 66 60 61" />
        <ellipse class="mouth-open" cx="50" cy="64" rx="5" ry="4" />

        <!-- little paws for shy -->
        <g class="paws">
          <ellipse cx="37" cy="47" rx="10" ry="8" />
          <ellipse cx="63" cy="47" rx="10" ry="8" />
        </g>
      </svg>

      <!-- mood props -->
      <div class="thinking-dots"><i></i><i></i><i></i></div>
      <svg class="sparkles" viewBox="0 0 100 100">
        <path d="M14 22 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z" />
        <path d="M86 16 l1.6 4 4 1.6 -4 1.6 -1.6 4 -1.6 -4 -4 -1.6 4 -1.6z" />
        <path d="M90 62 l1.3 3.2 3.2 1.3 -3.2 1.3 -1.3 3.2 -1.3 -3.2 -3.2 -1.3 3.2 -1.3z" />
      </svg>
      <span class="question">?</span>
      <span class="sweat"></span>
    </div>
  </div>
</div>

<div class="aurora" aria-hidden="true"><span></span><span></span><span></span><span></span></div>

<header class="nav-wrap">
  <nav class="nav glass">
    <a class="brand" routerLink="/chat" aria-label="Harsh Jaiswal, home">
      <app-companion [size]="30" [still]="true" />
      <span class="brand-word">harsh<em>.ai</em></span>
    </a>

    <div class="links">
      <a routerLink="/chat" routerLinkActive="active">Chat</a>
      <a routerLink="/jd-match" routerLinkActive="active">JD Match</a>
      @if (auth.isLoggedIn()) {
        <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
      }
    </div>

    <div class="actions">
      <button class="icon-btn" (click)="toggleTheme()" [attr.aria-label]="theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'">
        @if (theme() === 'dark') {
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></svg>
        } @else {
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
        }
      </button>
      @if (auth.isLoggedIn()) {
        <button class="text-btn" (click)="auth.logout()">Log out</button>
      } @else {
        <a class="text-btn" routerLink="/login" routerLinkActive="active">Admin</a>
      }
    </div>
  </nav>
</header>

<main class="main-content">
  <router-outlet />
</main>
